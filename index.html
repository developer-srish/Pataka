<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const cam=document.getElementById('cam'),modeEl=document.querySelector('#mode span'),
      bar=document.getElementById('bar'),skyBar=document.getElementById('skybar'),anchorBtn=document.getElementById('anchorBtn');
let F=800,W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;F=H*.866}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- audio ---------- */
let ac,noiseBuf,lastCrackle=0;
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function noise(type,freq,vol,dur,delay=0,q=0.7){
  if(!ac)return;
  const t=ac.currentTime+delay,s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.loop=true;s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random()*1.5);s.stop(t+dur+.02);
}
function sweepNoise(vol,low,dur,hi=4,delay=0){
  if(!ac)return;
  const t=ac.currentTime+delay,s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(low*hi,t);f.frequency.exponentialRampToValueAtTime(Math.max(low,30),t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random()*.5,dur+.02);
}
function thump(vol,f0,dur,delay=0){
  if(!ac)return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(22,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
// big explosion: crack + sweep + sub thump + rumble tail + echo
function bigBoom(power){ // 1 = sky shell, 2 = sutli/lakshmi, 3 = atom
  sweepNoise(Math.min(2.5,.7*power),Math.max(60,260/power),.8+power*.6,6);
  noise('highpass',2200,.5*power,.12);
  thump(Math.min(2.5,.7*power),110,.7+power*.5);
  if(power>=2){
    sweepNoise(Math.min(2.5,.6*power),70,1.8+power*.4,8,.18);
    noise('lowpass',160,.5*power,2+power*.5,.25);
    thump(1.6,70,1.8,.2);
    sweepNoise(.9,90,1.5,5,.55+power*.1); // echo off buildings
  }
  if(power>=3){thump(2.4,60,2.6,.05);sweepNoise(2,50,3,9,.5)}
}
// realistic lari snap: sharp crack + paper-body thud, irregular
function crack(vol=.3,big=false){
  if(!ac)return;
  const now=ac.currentTime;if(now-lastCrackle<.004)return;lastCrackle=now;
  const d=Math.random()*.014;
  noise('highpass',rnd(1500,4800),vol*rnd(.7,1.1),.045,d,1.2);
  noise('bandpass',rnd(900,2200),vol*.9,big?.12:.07,d,.9);
  noise('lowpass',big?500:900,vol*(big?1.3:.8),big?.2:.1,d);
  if(big)thump(vol*.7,rnd(160,230),.12,d);
}
function whistle(){
  if(!ac)return;
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(rnd(450,600),t);o.frequency.exponentialRampToValueAtTime(rnd(1500,2000),t+.7);
  g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.7);
}
function hiss(dur){noise('bandpass',5000,.05,Math.min(dur,2.5))}

/* ---------- state ---------- */
const rockets=[],sparks=[],bombs=[],laris=[],rings=[],fireballs=[],smoke=[];
let anchor=false,flash=0,shake=0,tilt=90,hasOri=false,selected='lari100',selSky='single',lastSkyBoom=0;
const palettes=[[45,100],[0,100],[330,95],[190,100],[120,90],[280,95],[20,100],[210,100]];
const DESIGNS=['peony','chrysanthemum','willow','ring','heart','star','spiral','crossette','glitter','double'];

const GROUND={
  lari100:{label:'Lari<br>100',icon:'🧨'},
  lari1000:{label:'Lari<br>1000',icon:'🎇'},
  lashi:{label:'Lakshmi<br>Bomb',icon:'🪔'},
  sutli:{label:'Sutli<br>Bomb',icon:'💣'},
  atom:{label:'Atom<br>Bomb',icon:'☢️'},
  anar:{label:'Anar<br>Fountain',icon:'🌋'},
  chakri:{label:'Chakri<br>Spinner',icon:'🌀'}
};
const SKY={
  single:{label:'Single<br>Shell',icon:'🎆'},
  s12:{label:'12<br>Shot',icon:'✨'},
  s25:{label:'25<br>Shot',icon:'🎇'},
  s50:{label:'50<br>Shot',icon:'💥'},
  s100:{label:'Grand<br>Finale',icon:'🌟'}
};
function buildBar(el,list,get,set){
  Object.keys(list).forEach(k=>{
    const b=document.createElement('button');
    b.innerHTML='<i>'+list[k].icon+'</i>'+list[k].label;
    if(k===get())b.className='on';
    b.addEventListener('click',e=>{e.stopPropagation();set(k);[...el.children].forEach(c=>c.classList.toggle('on',c===b))});
    b.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
    el.appendChild(b);
  });
}
buildBar(bar,GROUND,()=>selected,k=>selected=k);
buildBar(skyBar,SKY,()=>selSky,k=>selSky=k);
function anchorLabel(){anchorBtn.textContent=anchor?'📌 Floor-lock: ON':'📌 Floor-lock: OFF'}
anchorLabel();
anchorBtn.addEventListener('click',e=>{e.stopPropagation();anchor=!anchor;anchorLabel()});
anchorBtn.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
/* ---------- world anchoring: crackers are fixed on the floor ---------- */
const HC=1.5,D0=1.9; // camera height (m) and reference distance for sprite scale
const ori={a:0,b:90,g:0};
let TR=[1,0,0],TU=[0,0,1],TF=[0,1,0],CR=[1,0,0],CU=[0,0,1],CF=[0,1,0];
function setOri(a,b,g){
  ori.a=a;ori.b=b;ori.g=g;
  const d=Math.PI/180,ca=Math.cos(a*d),sa=Math.sin(a*d),cb=Math.cos(b*d),sb=Math.sin(b*d),cg=Math.cos(g*d),sg=Math.sin(g*d);
  TR=[ca*cg-sa*sb*sg, sa*cg+ca*sb*sg, -cb*sg];          // camera right  (device x)
  TU=[-sa*cb, ca*cb, sb];                                 // camera up     (device y)
  TF=[-(ca*sg+sa*sb*cg), -(sa*sg-ca*sb*cg), -(cb*cg)];    // camera forward(-device z)
}
function norm(v){const n=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/n,v[1]/n,v[2]/n]}
function smoothOri(){
  const k=.35;
  CR=norm(CR.map((c,i)=>c+(TR[i]-c)*k));
  CU=norm(CU.map((c,i)=>c+(TU[i]-c)*k));
  CF=norm(CF.map((c,i)=>c+(TF[i]-c)*k));
}
setOri(0,90,0);CR=TR;CU=TU;CF=TF;
// screen pixel -> point on the floor (world metres, east/north)
function toFloor(sx,sy){
  const cx=(sx-W/2)/F,cy=-(sy-H/2)/F;
  const dx=CR[0]*cx+CU[0]*cy+CF[0],dy=CR[1]*cx+CU[1]*cy+CF[1];
  let dz=CR[2]*cx+CU[2]*cy+CF[2];
  if(dz>-.08)dz=-.08;
  const t=HC/-dz;
  return{X:dx*t,Y:dy*t};
}
// floor point -> current screen position (null when behind the camera)
function project(X,Y){
  const dz=-HC;
  const cz=X*CF[0]+Y*CF[1]+dz*CF[2];
  if(cz<.15)return null;
  const cx=X*CR[0]+Y*CR[1]+dz*CR[2],cy=X*CU[0]+Y*CU[1]+dz*CU[2];
  return{x:W/2+cx/cz*F,y:H/2-cy/cz*F,cz,k:Math.max(.35,Math.min(2.2,D0/cz))};
}
function ground(){return hasOri&&CF[2]<-.6}
function projLari(L){
  if(L.fixed){for(let i=0;i<L.count;i++){const p=L.pts[i],c=L.sc[i];p.x=c.x;p.y=c.y;p.k=1;p.v=true}return}
  for(let i=0;i<L.count;i++){
    const w=L.w[i],p=L.pts[i],q=project(w.X,w.Y);
    if(q){p.x=q.x;p.y=q.y;p.k=q.k;p.v=true}else{p.x=-9999;p.y=-9999;p.v=false}
  }
}
function strokePts(L,a,b,step,dx,dy){
  ctx.beginPath();let pen=false;
  for(let k=a;k<=b;k+=step){
    const p=L.pts[k];
    if(!p.v){pen=false;continue}
    if(pen)ctx.lineTo(p.x+dx,p.y+dy);else{ctx.moveTo(p.x+dx,p.y+dy);pen=true}
  }
  ctx.stroke();
}

/* ---------- sky ---------- */
function launch(x,design,hue,delayTy){
  rockets.push({x,y:H,vx:rnd(-.6,.6),vy:-rnd(9,12.5),ty:H*(delayTy||rnd(.1,.45)),
    hue:hue||palettes[Math.random()*palettes.length|0],
    design:design||DESIGNS[Math.random()*DESIGNS.length|0]});
  whistle();
}
function burst(x,y,hue,design){
  let [h,s]=hue;
  const add=(a,sp,o)=>sparks.push(Object.assign({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.011,h,s,size:2,g:.04},o||{}));
  const TAU=6.2832;
  switch(design){
    case'peony':{const n=130;for(let i=0;i<n;i++)add(TAU*i/n,rnd(3.8,4.4));break}
    case'chrysanthemum':{const n=110;for(let i=0;i<n;i++)add(TAU*i/n,rnd(2,5),{decay:.006,g:.03,size:2.4});break}
    case'willow':{const n=100;h=38;s=85;for(let i=0;i<n;i++)add(Math.random()*TAU,rnd(1.5,4.5),{decay:.0042,g:.032,size:1.5,h:rnd(32,46)});break}
    case'ring':{const n=70;for(let i=0;i<n;i++)add(TAU*i/n,5.2,{g:.02,decay:.012});break}
    case'double':{const n=70;for(let i=0;i<n;i++){add(TAU*i/n,5.4,{g:.02});add(TAU*i/n,2.7,{h:(h+160)%360,g:.02})}break}
    case'heart':{const n=90;for(let i=0;i<n;i++){const t=TAU*i/n,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      sparks.push({x,y,vx:hx*.27,vy:hy*.27,life:1,decay:.011,h:rnd(340,360),s:95,size:2.2,g:.02})}break}
    case'star':{const n=120;for(let i=0;i<n;i++){const a=TAU*i/n,m=Math.pow(Math.abs(Math.cos(2.5*a)),1.5);add(a,2+4.2*m,{g:.02,decay:.012})}break}
    case'spiral':{const n=120;for(let i=0;i<n;i++)add(i*.33,.8+i*.045,{g:.02,decay:.012});break}
    case'crossette':{for(let i=0;i<10;i++)add(TAU*i/10,rnd(4.2,4.8),{decay:.016,split:true,size:2.6});break}
    case'glitter':{const n=120;for(let i=0;i<n;i++)add(Math.random()*TAU,rnd(.5,5.5),{decay:.0075,tw:true,h:rnd(40,55),s:70,size:1.8});break}
  }
  flash=Math.min(flash+.22,.45);
  const now=performance.now();
  if(now-lastSkyBoom>90){lastSkyBoom=now;bigBoom(1)}
  setTimeout(()=>crack(.3),rnd(150,300));setTimeout(()=>crack(.25),rnd(300,500));
}
function sequence(count,gap,fan){
  const designs=DESIGNS.slice().sort(()=>Math.random()-.5);
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const u=count>1?i/(count-1):.5;
      let x=fan?W*(.08+.84*(i%2?1-u:u)):rnd(W*.08,W*.92);
      if(count<=12)x=W*(.1+.8*u);
      const hue=palettes[(i+(Math.random()*3|0))%palettes.length];
      const design=count>=50?DESIGNS[Math.random()*DESIGNS.length|0]:designs[i%designs.length];
      launch(x,design,hue,rnd(.1,.45));
    },i*gap);
  }
}
function skyShot(x){
  if(selSky==='single')launch(x);
  else if(selSky==='s12')sequence(12,260,false);
  else if(selSky==='s25')sequence(25,190,true);
  else if(selSky==='s50')sequence(50,130,false);
  else sequence(100,85,false);
}

/* ---------- ground crackers ---------- */
function paper(x,y,n,pow,h=355){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=Math.random()*pow;
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-pow*.3,life:1,decay:.014+Math.random()*.02,h:h+Math.random()*12,s:92,size:2+Math.random()*2.2,g:.15});
  }
}
function pop(x,y,big){
  const n=big?9:5;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=1+Math.random()*(big?5:3);
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,decay:.07+Math.random()*.05,h:rnd(15,40),s:100,size:1.6+Math.random()*1.5,g:.12});
  }
  paper(x,y,big?5:3,big?3.5:2.2);
  if(Math.random()<.25)smoke.push({x,y,r:6,life:.6});
  flash=Math.min(flash+(big?.05:.025),.22);
  if(big)shake=Math.max(shake,1.8);
  crack(big?.42:.26,big);
}
function startLari(x,y,count){
  const big=count>100;
  const span=W*(big?.94:.62);
  const x0=Math.max(W*.03,Math.min(x-span/2,W-span-W*.03));
  const w=[],pts=[],sc=[];
  for(let i=0;i<count;i++){
    const u=i/(count-1);
    w.push(toFloor(x0+span*u,y+Math.sin(u*(big?18:7))*(big?14:10)));
    pts.push({x:0,y:0,k:1,v:true});
    sc.push({x:x0+span*u,y:y+Math.sin(u*(big?18:7))*(big?14:10)});
  }
  laris.push({w,pts,fixed:!anchor,sc,count,t:0,dur:big?780:380,big});
  hiss(1.5);
}
const props=[];
function startBomb(kind,x,y){
  const cfg={
    sutli:{fuse:110,r:14,h:28,col:'#7a5230'},
    lashi:{fuse:150,r:16,h:50,col:'#c1261b'},
    atom:{fuse:260,r:32,h:64,col:'#23232a'}
  }[kind];
  const f=toFloor(x,y);
  bombs.push(Object.assign({x,y,sx:x,sy:y,fixed:!anchor,X:f.X,Y:f.Y,k:1,kind,t:0},cfg));
  hiss(cfg.fuse/60);
}
function startAnar(x,y){const f=toFloor(x,y);props.push({kind:'anar',x,y,sx:x,sy:y,fixed:!anchor,X:f.X,Y:f.Y,k:1,h:44,t:0,fuse:45,dur:340});hiss(.8)}
function startChakri(x,y){const f=toFloor(x,y);props.push({kind:'chakri',x,y,sx:x,sy:y,fixed:!anchor,X:f.X,Y:f.Y,k:1,h:8,t:0,fuse:40,dur:340,ang:0});hiss(.7)}
function fountainSound(d){noise('bandpass',3500,.14,d,0,.6);noise('lowpass',700,.22,d);noise('highpass',6000,.05,d)}
function chakriSound(d){
  if(!ac)return;
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.linearRampToValueAtTime(700,t+d*.5);o.frequency.linearRampToValueAtTime(260,t+d);
  g.gain.setValueAtTime(.02,t);g.gain.linearRampToValueAtTime(.05,t+d*.5);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
  noise('bandpass',4500,.1,d,0,.8);
}
function explode(b){
  const vib=p=>navigator.vibrate&&navigator.vibrate(p);
  if(b.kind==='sutli'){
    for(let i=0;i<120;i++){const a=Math.random()*6.283,sp=Math.random()*11;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,decay:.025+Math.random()*.03,h:rnd(20,45),s:100,size:2+Math.random()*3,g:.12})}
    paper(b.x,b.y,70,10,30);
    for(let k=0;k<2;k++)rings.push({x:b.x,y:b.y,r:5,life:1+k*.2,sp:12+k*5,c:'255,220,150',w:5});
    fireballs.push({x:b.x,y:b.y,r:10,max:110,life:1});
    flash=.9;shake=Math.max(shake,26);bigBoom(2);vib([120,40,160]);
  }else if(b.kind==='lashi'){
    for(let i=0;i<160;i++){const a=Math.random()*6.283,sp=Math.random()*12;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:.02+Math.random()*.03,h:rnd(15,40),s:100,size:2+Math.random()*3,g:.12})}
    paper(b.x,b.y,110,12,0);
    for(let k=0;k<3;k++)rings.push({x:b.x,y:b.y,r:6,life:1+k*.2,sp:12+k*5,c:'255,190,110',w:5});
    fireballs.push({x:b.x,y:b.y,r:10,max:150,life:1});
    flash=1;shake=Math.max(shake,32);bigBoom(2.3);vib([150,50,220]);
  }else{
    for(let i=0;i<340;i++){const a=Math.random()*6.283,sp=Math.random()*16;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:.01+Math.random()*.02,h:rnd(15,55),s:100,size:2.5+Math.random()*3.5,g:.06})}
    paper(b.x,b.y,130,15,20);
    for(let k=0;k<4;k++)rings.push({x:b.x,y:b.y,r:6,life:1+k*.25,sp:14+k*5,c:'255,230,170',w:6});
    fireballs.push({x:b.x,y:b.y,r:20,max:Math.max(W,H)*.55,life:1,atom:true,cx:b.x,cy:b.y});
    flash=1;shake=40;bigBoom(3);vib([200,60,300]);
  }
}

/* ---------- input ---------- */
function tap(e){
  if(document.getElementById('intro'))return;
  const t=e.touches?e.touches[0]:e,x=t.clientX,y=t.clientY;
  if(!ground()){skyShot(x);return}
  let px=W/2,py=H*.7;
  if(selected!=='lari100'&&selected!=='lari1000'){
    for(const o of bombs.concat(props)){if(Math.hypot(o.x-px,o.y-py)<26){px+=rnd(-30,30);py+=rnd(-8,8);break}}
  }
  if(selected==='lari100')startLari(px,py,100);
  else if(selected==='lari1000')startLari(px,py,1000);
  else if(selected==='anar')startAnar(px,py);
  else if(selected==='chakri')startChakri(px,py);
  else startBomb(selected,px,py);
}
cv.addEventListener('touchstart',e=>{e.preventDefault();tap(e)},{passive:false});
cv.addEventListener('mousedown',tap);

/* ---------- drawing ---------- */
function shadow(x,y,rx,ry){
  ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);
  const g=ctx.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,rx,0,6.283);ctx.fill();ctx.restore();
}
function cyl(x,y,rx,h,dark,mid,light,top){
  const ry=rx*.32;
  const g=ctx.createLinearGradient(x-rx,0,x+rx,0);
  g.addColorStop(0,dark);g.addColorStop(.28,light);g.addColorStop(.55,mid);g.addColorStop(1,dark);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,6.283);ctx.fill();
  ctx.fillRect(x-rx,y-h,rx*2,h);
  ctx.fillStyle=top;ctx.beginPath();ctx.ellipse(x,y-h,rx,ry,0,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(x,y-h,rx,ry,0,0,6.283);ctx.stroke();
}
function miniCracker(x,y,rx,h){
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x+rx,y+1,rx*1.8,rx*.6,0,0,6.283);ctx.fill();
  ctx.fillStyle='#a81a10';ctx.fillRect(x-rx,y-h,rx,h);
  ctx.fillStyle='#e0382a';ctx.fillRect(x,y-h,rx,h);
  ctx.fillStyle='#ffcf3a';ctx.fillRect(x-rx,y-h,rx*2,2);
  ctx.fillStyle='#f4a39a';ctx.beginPath();ctx.ellipse(x,y-h,rx,rx*.4,0,0,6.283);ctx.fill();
}
function drawBomb(b){
  const x=b.x,y=b.y,r=b.r,h=b.h,topY=y-h,k=b.k||1;
  shadow(x+r*.3,y+1,r*1.6,r*.5);
  if(b.kind==='lashi'){ // cylindrical Lakshmi bomb
    cyl(x,y,r,h,'#4d0b07','#c1261b','#f0604b','#8a160e');
    ctx.strokeStyle='#ffd86b';ctx.lineWidth=5;
    for(const f of[.18,.82]){ctx.beginPath();ctx.ellipse(x,y-h*f,r,r*.32,0,0.05,Math.PI-.05);ctx.stroke()}
    ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(x-r*.12,y-h*.5,r*.42,0,6.283);ctx.fill();
    ctx.fillStyle='#b3261e';ctx.beginPath();ctx.arc(x-r*.12,y-h*.5,r*.26,0,6.283);ctx.fill();
    ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(x-r*.12,y-h*.5,r*.1,0,6.283);ctx.fill();
  }else if(b.kind==='sutli'){ // thread-wrapped ball
    const cy=y-r;
    const g=ctx.createRadialGradient(x-r*.35,cy-r*.4,r*.1,x,cy,r);
    g.addColorStop(0,'#d2a874');g.addColorStop(.5,b.col);g.addColorStop(1,'#2a170a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,cy,r,0,6.283);ctx.fill();
    ctx.save();ctx.beginPath();ctx.arc(x,cy,r,0,6.283);ctx.clip();
    ctx.strokeStyle='rgba(235,215,170,.55)';ctx.lineWidth=1.2;
    for(let i=0;i<7;i++){ctx.beginPath();ctx.ellipse(x,cy,r*1.15,r*(.2+i*.12),i*.45,0,6.283);ctx.stroke()}
    ctx.restore();
  }else{ // atom: big metal sphere on a base ring
    const cy=y-r;
    ctx.fillStyle='#0e0e12';ctx.beginPath();ctx.ellipse(x,y-2,r*.6,r*.2,0,0,6.283);ctx.fill();
    const g=ctx.createRadialGradient(x-r*.35,cy-r*.4,r*.08,x,cy,r);
    g.addColorStop(0,'#8d8d9a');g.addColorStop(.35,'#3a3a44');g.addColorStop(1,'#07070a');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,cy,r,0,6.283);ctx.fill();
    ctx.strokeStyle='#ffd000';ctx.lineWidth=6;
    ctx.beginPath();ctx.ellipse(x,cy,r*.98,r*.3,0,0.05,Math.PI-.05);ctx.stroke();
    ctx.globalAlpha=.35;ctx.beginPath();ctx.ellipse(x,cy,r*.98,r*.3,0,Math.PI+.05,6.283-.05);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle='#ffd000';ctx.font='bold '+(r*.8)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('☢',x,cy-r*.45);
  }
  const fl=b.kind==='sutli'?46:b.kind==='atom'?60:36;
  const len=fl*(1-Math.min(1,b.t/b.fuse));
  ctx.strokeStyle=b.kind==='sutli'?'#c9a46a':'#d7c7a0';ctx.lineWidth=b.kind==='sutli'?3:2.5;
  ctx.beginPath();ctx.moveTo(x,topY);
  const tipX=x+Math.sin(len*.15)*10+len*.2,tipY=topY-len;
  ctx.bezierCurveTo(x+10,topY-len*.3,x-8,topY-len*.7,tipX,tipY);ctx.stroke();
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(tipX,tipY,3+Math.random()*3,0,6.283);ctx.fill();
  sparks.push({x:x+(tipX-x)*k,y:y+(tipY-y)*k,vx:rnd(-1.5,1.5),vy:-Math.random()*3,life:.7,decay:.08,h:rnd(35,50),s:100,size:1.6,g:.1});
  ctx.globalCompositeOperation='source-over';
}
function drawAnar(o){
  const lit=o.t>=o.fuse,u=lit?(o.t-o.fuse)/o.dur:0;
  const x=o.x,y=o.y,h=o.h,bw=17,tw=13,k=o.k||1;
  shadow(x+6,y+1,28,8);
  const g=ctx.createLinearGradient(x-bw,0,x+bw,0);
  g.addColorStop(0,'#4a2010');g.addColorStop(.3,'#e0783f');g.addColorStop(.6,'#c05a28');g.addColorStop(1,'#3d1a0c');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(x,y,bw,5.5,0,0,6.283);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-bw,y);ctx.lineTo(x-tw,y-h);ctx.lineTo(x+tw,y-h);ctx.lineTo(x+bw,y);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#ffd86b';ctx.lineWidth=4;
  ctx.beginPath();ctx.ellipse(x,y-h*.3,bw-1.5,5,0,0.05,Math.PI-.05);ctx.stroke();
  ctx.strokeStyle='#2fa84f';ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(x,y-h*.62,bw-4,4.5,0,0.05,Math.PI-.05);ctx.stroke();
  ctx.fillStyle=lit?'#ffb03a':'#2a1208';
  ctx.beginPath();ctx.ellipse(x,y-h,tw,4.5,0,0,6.283);ctx.fill();
  ctx.strokeStyle='#f3a65a';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(x,y-h,tw,4.5,0,0,6.283);ctx.stroke();
  ctx.globalCompositeOperation='lighter';
  if(!lit){
    const len=16*(1-o.t/o.fuse);
    ctx.strokeStyle='#d7c7a0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x+len*.25,y-h-len);ctx.stroke();
    ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(x+len*.25,y-h-len,3+Math.random()*2,0,6.283);ctx.fill();
    sparks.push({x:x+len*.25*k,y:y-(h+len)*k,vx:rnd(-1,1),vy:-Math.random()*2,life:.6,decay:.08,h:40,s:100,size:1.4,g:.1});
  }else{
    const power=Math.pow(Math.sin(Math.PI*Math.min(1,u)),.6),n=Math.round(7*power)+1;
    const phase=[[38,52],[110,140],[0,14],[195,215]][Math.floor(u*4)%4];
    for(let k=0;k<n;k++){
      const col=Math.random()<.55?[36,52]:phase;
      sparks.push({x:x+rnd(-4,4)*k,y:y-h*k,vx:rnd(-1.7,1.7)*(1+power*.4)*k,vy:-rnd(4,8.6)*(.55+power*.55)*k,life:1,decay:rnd(.012,.02),
        h:rnd(col[0],col[1]),s:Math.random()<.3?25:100,size:rnd(1.5,2.3),g:.12});
    }
    const gl=ctx.createRadialGradient(x,y-h,0,x,y-h,70);
    gl.addColorStop(0,`rgba(255,200,100,${.7*power})`);gl.addColorStop(1,'rgba(255,120,20,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y-h,70,0,6.283);ctx.fill();
    ctx.save();ctx.translate(x,y);ctx.scale(1,.3);
    const fg=ctx.createRadialGradient(0,0,0,0,0,90);fg.addColorStop(0,`rgba(255,170,70,${.5*power})`);fg.addColorStop(1,'rgba(255,120,20,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,90,0,6.283);ctx.fill();ctx.restore();
    if(Math.random()<.22)crack(.12);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawChakri(o){
  const lit=o.t>=o.fuse,u=lit?(o.t-o.fuse)/o.dur:0;
  const cx=o.x,cy=o.y-6,rx=30,ry=11,k=o.k||1;
  const power=lit?Math.pow(Math.sin(Math.PI*Math.min(1,u)),.5):0;
  if(lit)o.ang+=.12+.5*power;
  shadow(cx+3,o.y+1,rx+8,ry+1);
  ctx.fillStyle='#5b140c';ctx.fillRect(cx-rx,cy,rx*2,6);
  ctx.beginPath();ctx.ellipse(cx,cy+6,rx,ry,0,0,6.283);ctx.fill();
  const tg=ctx.createRadialGradient(cx-rx*.3,cy-ry*.3,2,cx,cy,rx);
  tg.addColorStop(0,'#f0523a');tg.addColorStop(1,'#a8200f');
  ctx.fillStyle=tg;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(255,215,110,.7)';ctx.lineWidth=1.6;ctx.beginPath();
  for(let a=0;a<12.57;a+=.2){const r=a/12.57,px=cx+Math.cos(a+o.ang)*r*rx*.95,py=cy+Math.sin(a+o.ang)*r*ry*.95;a===0?ctx.moveTo(px,py):ctx.lineTo(px,py)}
  ctx.stroke();
  ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.ellipse(cx,cy,3,1.4,0,0,6.283);ctx.fill();
  ctx.globalCompositeOperation='lighter';
  if(!lit){
    const len=14*(1-o.t/o.fuse),fx=cx+rx*.9+len,fy=cy-len*.3;
    ctx.strokeStyle='#d7c7a0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+rx*.9,cy);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(fx,fy,3+Math.random()*2,0,6.283);ctx.fill();
  }else{
    for(let k=0;k<4;k++){
      const a=o.ang+k*1.57+rnd(-.2,.2),sp=rnd(3,6.5)*(.5+power)*k;
      const col=Math.random()<.2?rnd(100,140):Math.random()<.25?rnd(0,12):rnd(28,52);
      sparks.push({x:cx+Math.cos(a)*rx*k,y:o.y-6*k+Math.sin(a)*ry*k,vx:-Math.sin(a)*sp+Math.cos(a)*1.5,vy:Math.cos(a)*sp*.4-rnd(.3,2),life:1,decay:rnd(.03,.05),
        h:col,s:Math.random()<.3?30:100,size:rnd(1.4,2.2),g:.08});
    }
    ctx.save();ctx.translate(cx,o.y);ctx.scale(1,.3);
    const fg=ctx.createRadialGradient(0,0,0,0,0,100);fg.addColorStop(0,`rgba(255,170,70,${.6*power})`);fg.addColorStop(1,'rgba(255,120,20,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(0,0,100,0,6.283);ctx.fill();ctx.restore();
    if(Math.random()<.18)crack(.1);
  }
  ctx.globalCompositeOperation='source-over';
}

function frame(){
  smoothOri();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(shake>.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}else shake=0;

  const g=ground();
  modeEl.innerHTML=g?'<b>GROUND</b> · pick a cracker, tap to light it at the yellow circle':'<b>SKY</b> · pick a shot type, tap to fire';
  bar.style.display=g?'flex':'none';
  anchorBtn.style.display=g?'block':'none';
  skyBar.style.display=g?'none':'flex';

  ctx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy*=.985;
    sparks.push({x:r.x,y:r.y,vx:rnd(-.25,.25),vy:Math.random()*.8,life:.6,decay:.05,h:35,s:100,size:1.4,g:0});
    if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y,r.hue,r.design);rockets.splice(i,1)}
  }
  for(let i=laris.length-1;i>=0;i--){
    const L=laris[i],prev=Math.floor(L.t/L.dur*L.count);
    projLari(L);
    L.t++;
    const now=Math.min(L.count,Math.floor(L.t/L.dur*L.count));
    for(let k=prev;k<now;k++){const p=L.pts[k];if(p)pop(p.x,p.y,Math.random()<(L.big?.3:.2))}
    const hp=L.pts[Math.min(now,L.count-1)];
    ctx.fillStyle='rgba(255,180,70,.95)';ctx.beginPath();ctx.arc(hp.x,hp.y,5+Math.random()*3,0,6.283);ctx.fill();
    if(L.t>=L.dur){const lp=L.pts[L.count-1];pop(lp.x,lp.y,true);bigBoom(1.3);laris.splice(i,1)}
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.split&&p.life<.7){p.split=false;
      for(let k=0;k<5;k++){const a=Math.random()*6.283,sp=rnd(1.5,3);
        sparks.push({x:p.x,y:p.y,vx:p.vx*.3+Math.cos(a)*sp,vy:p.vy*.3+Math.sin(a)*sp,life:.85,decay:.016,h:p.h,s:p.s,size:2,g:.04})}
      sparks.splice(i,1);continue}
    if(p.life<=0){sparks.splice(i,1);continue}
    if(p.tw&&Math.random()<.45)continue;
    ctx.fillStyle=`hsla(${p.h},${p.s}%,${55+p.life*25}%,${p.life})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life+.4,0,6.283);ctx.fill();
  }
  for(let i=fireballs.length-1;i>=0;i--){
    const f=fireballs[i];f.r+=(f.max-f.r)*(f.atom?.045:.12);f.life-=f.atom?.011:.04;
    if(f.life<=0){fireballs.splice(i,1);continue}
    const a=Math.max(0,f.life);
    if(f.atom){f.y-=1.2;
      if(Math.random()<.8)smoke.push({x:f.cx+(Math.random()-.5)*f.r*.35,y:f.cy-(f.cy-f.y)*Math.random(),r:f.r*.25,life:1});
      const rg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      rg.addColorStop(0,`rgba(255,255,230,${a})`);rg.addColorStop(.3,`rgba(255,200,60,${a*.9})`);
      rg.addColorStop(.7,`rgba(255,80,10,${a*.6})`);rg.addColorStop(1,'rgba(120,20,0,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
      const sg=ctx.createLinearGradient(0,f.cy,0,f.y);
      sg.addColorStop(0,`rgba(255,120,20,${a*.7})`);sg.addColorStop(1,`rgba(255,200,80,${a*.3})`);
      ctx.fillStyle=sg;ctx.fillRect(f.cx-f.r*.13,f.y,f.r*.26,f.cy-f.y);
    }else{
      const rg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      rg.addColorStop(0,`rgba(255,240,180,${a})`);rg.addColorStop(.5,`rgba(255,140,30,${a*.7})`);rg.addColorStop(1,'rgba(150,30,0,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
    }
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.r+=r.sp;r.life-=.04;
    if(r.life<=0){rings.splice(i,1);continue}
    ctx.strokeStyle=`rgba(${r.c},${Math.min(1,r.life)*.7})`;ctx.lineWidth=r.w||3;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  for(let i=smoke.length-1;i>=0;i--){
    const s=smoke[i];s.life-=.012;s.y-=.6;s.r+=.6;
    if(s.life<=0){smoke.splice(i,1);continue}
    ctx.fillStyle=`rgba(50,45,50,${s.life*.2})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
  }
  // yellow target circle: crackers are placed here
  if(g){
    const cx=W/2,cy=H*.7,now=performance.now(),pulse=1+Math.sin(now/300)*.04;
    ctx.save();ctx.translate(cx,cy);ctx.scale(1,.35);
    ctx.fillStyle='rgba(255,212,0,.16)';ctx.beginPath();ctx.arc(0,0,52,0,6.283);ctx.fill();
    ctx.shadowColor='#ffd400';ctx.shadowBlur=18;ctx.strokeStyle='#ffd400';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(0,0,52*pulse,0,6.283);ctx.stroke();
    ctx.shadowBlur=0;ctx.lineWidth=2.5;ctx.setLineDash([10,8]);ctx.lineDashOffset=-now/60;
    ctx.beginPath();ctx.arc(0,0,38,0,6.283);ctx.stroke();
    ctx.restore();
  }
  // red lari lying on the floor
  for(const L of laris){
    const now=Math.min(L.count-1,Math.floor(L.t/L.dur*L.count)),step=L.big?3:1;
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=L.big?3:4;strokePts(L,now,L.count-1,step,2,4);
    ctx.strokeStyle='rgba(30,25,25,.75)';ctx.lineWidth=L.big?2:3;strokePts(L,0,now,step,0,0);
    ctx.strokeStyle='#9c1a10';ctx.lineWidth=L.big?2:2.5;strokePts(L,now,L.count-1,step,0,0);
    const gap=L.big?8:3,rx=L.big?2:3,ch=L.big?8:11;
    for(let k=now;k<L.count;k+=gap){const p=L.pts[k];if(p.v)miniCracker(p.x,p.y,rx*p.k,ch*p.k)}
  }
  // standing crackers: anchored to the floor, drawn far-to-near
  const objs=bombs.concat(props);
  for(const o of objs){
    const q=o.fixed?{x:o.sx,y:o.sy,cz:D0,k:1}:project(o.X,o.Y);o.v=!!q;
    if(q){o.x=q.x;o.y=q.y;o.k=q.k;o.cz=q.cz}else o.cz=0;
  }
  objs.sort((a,b)=>(b.cz-a.cz)||(a.y-b.y));
  for(const o of objs){
    o.t++;
    if(o.t===o.fuse){if(o.kind==='anar')fountainSound(o.dur/60);else if(o.kind==='chakri')chakriSound(o.dur/60)}
    if(!o.v)continue;
    ctx.save();ctx.translate(o.x,o.y);ctx.scale(o.k,o.k);ctx.translate(-o.x,-o.y);
    if(o.kind==='anar')drawAnar(o);else if(o.kind==='chakri')drawChakri(o);else drawBomb(o);
    ctx.restore();
  }
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];
    if(b.t>=b.fuse){explode({kind:b.kind,x:b.x,y:b.y-b.h*(b.k||1)/2});bombs.splice(i,1)}
  }
  for(let i=props.length-1;i>=0;i--){
    const p=props[i];
    if(p.t>=p.fuse+p.dur){pop(p.x,p.y-p.h*(p.k||1),true);props.splice(i,1)}
  }
  if(flash>0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle=`rgba(255,225,175,${Math.min(1,flash)})`;ctx.fillRect(0,0,W,H);
    flash*=.88;if(flash<.01)flash=0;
  }
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
document.getElementById('start').addEventListener('click',async()=>{
  initAudio();
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')
      await DeviceOrientationEvent.requestPermission();
  }catch(e){}
  addEventListener('deviceorientation',e=>{if(e.beta!=null){hasOri=true;setOri(e.alpha||0,e.beta,e.gamma||0)}});
  try{
    cam.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){}
  document.getElementById('intro').remove();
  frame();
  setTimeout(()=>launch(W/2,'peony'),400);
});

// Desktop testing: press G to toggle ground mode when no motion sensor exists
addEventListener('keydown',e=>{
  if(e.key==='g'||e.key==='G'){hasOri=true;setOri(ori.a,ori.b<60?90:35,ori.g)}
});
})();
