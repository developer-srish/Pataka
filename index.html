<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Diwali crackers through your phone camera. Tilt up for sky shots, tilt down for Lari, Lashi, Sutli and Atom bombs.">
<title>Phataka</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:#0d0a16;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
  video,canvas{position:fixed;inset:0;width:100%;height:100%}
  video{object-fit:cover;background:linear-gradient(#0d0a16,#2a1236 70%,#4a1d2e)}
  #intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 30%,#3b1550,#0d0a16 70%)}
  #intro small{letter-spacing:.35em;text-transform:uppercase;color:#ffb347;font-size:12px}
  #intro h1{font-size:clamp(48px,15vw,96px);font-weight:800;background:linear-gradient(90deg,#ffb347,#ff5e62,#ffd86b);-webkit-background-clip:text;background-clip:text;color:transparent}
  #intro p{max-width:310px;color:#d8c9e6;line-height:1.5}
  #start{margin-top:10px;padding:16px 56px;border:0;border-radius:999px;font-size:18px;font-weight:700;color:#2a0f00;
    background:linear-gradient(90deg,#ffd86b,#ff9a3c);box-shadow:0 0 30px #ff9a3c88;cursor:pointer}
  #mode{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:5;text-align:center;font-size:13px;pointer-events:none;text-shadow:0 1px 4px #000}
  #mode span{display:inline-block;padding:7px 16px;border-radius:999px;background:#000a;border:1px solid #ffffff33}
  #mode b{color:#ffd86b}
  #bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:none;gap:8px;justify-content:center;padding:0 8px}
  #bar button{flex:1;max-width:84px;padding:10px 2px;border-radius:14px;border:1.5px solid #ffffff44;background:#000b;color:#fff;font-size:11px;font-weight:700;line-height:1.25;cursor:pointer}
  #bar button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
  #bar button.on{border-color:#ffd86b;background:#ff9a3c33;box-shadow:0 0 14px #ffb34788}
  #sky{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));z-index:5;text-align:center;font-size:13px;color:#ffffffcc;pointer-events:none;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="mode"><span></span></div>
<div id="sky">Tap the sky to launch a shell · tilt phone down for ground crackers</div>
<div id="bar"></div>
<div id="intro">
  <small>Happy Diwali</small>
  <h1>Phataka</h1>
  <p>Allow camera. Tilt up and tap for sky shots. Tilt down for Lari 100, Lari 1000, Lashi, Sutli and Atom bomb.</p>
  <button id="start">Start</button>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const cam=document.getElementById('cam'),modeEl=document.querySelector('#mode span'),
      bar=document.getElementById('bar'),skyHint=document.getElementById('sky');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let ac,noiseBuf,lastCrackle=0;
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function boom(vol=1,low=400,dur=.6,hi=4){
  if(!ac)return;
  const t=ac.currentTime,s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(low*hi,t);f.frequency.exponentialRampToValueAtTime(Math.max(low,40),t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random()*.4,dur);
  if(low<150){ // sub thump
    const o=ac.createOscillator(),og=ac.createGain();
    o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(25,t+dur);
    og.gain.setValueAtTime(vol*.9,t);og.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(og);og.connect(ac.destination);o.start(t);o.stop(t+dur);
  }
}
function crack(vol=.25){
  if(!ac)return;
  const now=ac.currentTime;if(now-lastCrackle<.02)return;lastCrackle=now;
  const s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1800+Math.random()*2500;
  const g=ac.createGain();g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.001,now+.07);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(now,Math.random()*1.5,.08);
}
function whistle(){
  if(!ac)return;
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(1800,t+.7);
  g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.7);
}
function hiss(dur){
  if(!ac)return;
  const t=ac.currentTime,s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=5000;
  const g=ac.createGain();g.gain.setValueAtTime(.05,t);g.gain.linearRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,0,Math.min(dur,1.9));
}

/* ---------- state ---------- */
const rockets=[],sparks=[],bombs=[],laris=[],rings=[],fireballs=[],smoke=[];
let flash=0,shake=0,tilt=90,hasOri=false,selected='lari100';
const palettes=[[45,100],[0,100],[330,95],[190,100],[120,90],[280,95],[20,100]];

const TYPES={
  lari100:{label:'Lari<br>100',icon:'🧨'},
  lari1000:{label:'Lari<br>1000',icon:'🎆'},
  lashi:{label:'Lashi<br>Bomb',icon:'💣'},
  sutli:{label:'Sutli<br>Bomb',icon:'🪢'},
  atom:{label:'Atom<br>Bomb',icon:'☢️'}
};
Object.keys(TYPES).forEach(k=>{
  const b=document.createElement('button');
  b.innerHTML='<i>'+TYPES[k].icon+'</i>'+TYPES[k].label;
  b.dataset.k=k;if(k===selected)b.className='on';
  const pick=e=>{e.stopPropagation();selected=k;[...bar.children].forEach(c=>c.classList.toggle('on',c===b))};
  b.addEventListener('click',pick);
  b.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  bar.appendChild(b);
});

function ground(){return hasOri&&tilt<50}

/* ---------- sky ---------- */
function launch(x){
  rockets.push({x,y:H,vx:(Math.random()-.5)*1.2,vy:-(9+Math.random()*3),ty:H*(.12+Math.random()*.35),hue:palettes[Math.random()*palettes.length|0]});
  whistle();
}
function burst(x,y,hue){
  const type=Math.random(),n=70+(Math.random()*60|0),[h,s]=hue,two=Math.random()<.4;
  for(let i=0;i<n;i++){
    let a=Math.PI*2*i/n,sp=type<.3?3.5:2+Math.random()*3.5;
    if(type>.8){a=Math.random()*Math.PI*2;sp=Math.random()*5}
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.008+Math.random()*.01,
      h:two&&i%2?(h+60)%360:h,s,size:1.6+Math.random()*1.4,g:.045});
  }
  flash=Math.min(flash+.25,.45);boom(.9,300,1.1);
  setTimeout(()=>crack(.3),200);setTimeout(()=>crack(.3),380);
}

/* ---------- ground crackers ---------- */
function paper(x,y,n,pow,h=355){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=Math.random()*pow;
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-pow*.3,life:1,decay:.015+Math.random()*.02,h:h+Math.random()*15,s:90,size:2+Math.random()*2,g:.15});
  }
}
function pop(x,y,big){
  for(let i=0;i<(big?9:5);i++){
    const a=Math.random()*6.283,sp=1+Math.random()*(big?5:3);
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,decay:.07+Math.random()*.05,h:25+Math.random()*25,s:100,size:1.6+Math.random()*1.4,g:.12});
  }
  paper(x,y,big?3:2,big?3:2);
  flash=Math.min(flash+(big?.06:.03),.25);
  crack(big?.35:.22);
}
function startLari(x,y,count){
  const span=Math.min(W*(count>100?.94:.62),count>100?W*.94:W*.62);
  const x0=Math.max(W*.03,Math.min(x-span/2,W-span-W*.03));
  const pts=[];
  for(let i=0;i<count;i++){
    const u=i/(count-1);
    pts.push({x:x0+span*u,y:y+Math.sin(u*(count>100?18:7))*(count>100?14:10)});
  }
  const dur=count>100?720:360; // frames
  laris.push({pts,count,t:0,dur,done:0,big:count>100});
  hiss(1.5);
}
function startBomb(kind,x,y){
  const cfg={
    sutli:{fuse:110,r:11,col:'#6b4a2b',band:'#d7b98e',name:'sutli'},
    lashi:{fuse:150,r:17,col:'#b3261e',band:'#ffd86b',name:'lashi'},
    atom:{fuse:260,r:30,col:'#1d1d22',band:'#ffd000',name:'atom'}
  }[kind];
  bombs.push(Object.assign({x,y,kind,t:0},cfg));
  hiss(cfg.fuse/60);
}
function explode(b){
  if(b.kind==='sutli'){
    for(let i=0;i<40;i++){const a=Math.random()*6.283,sp=Math.random()*6;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,decay:.05,h:35,s:100,size:2,g:.12})}
    paper(b.x,b.y,16,5,30);
    rings.push({x:b.x,y:b.y,r:3,life:1,sp:7,c:'255,220,150'});
    flash=Math.max(flash,.4);shake=Math.max(shake,6);boom(1.0,500,.35,6);
    navigator.vibrate&&navigator.vibrate(40);
  }else if(b.kind==='lashi'){
    for(let i=0;i<90;i++){const a=Math.random()*6.283,sp=Math.random()*8;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,decay:.03+Math.random()*.03,h:20+Math.random()*30,s:100,size:2+Math.random()*2.5,g:.12})}
    paper(b.x,b.y,70,9,0);
    rings.push({x:b.x,y:b.y,r:6,life:1,sp:10,c:'255,190,110'});
    fireballs.push({x:b.x,y:b.y,r:10,max:70,life:1});
    flash=Math.max(flash,.6);shake=Math.max(shake,14);boom(1.5,250,.9,5);
    navigator.vibrate&&navigator.vibrate(90);
  }else{ // atom
    for(let i=0;i<320;i++){const a=Math.random()*6.283,sp=Math.random()*16;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:.01+Math.random()*.02,h:15+Math.random()*40,s:100,size:2.5+Math.random()*3.5,g:.06})}
    paper(b.x,b.y,120,14,20);
    for(let k=0;k<4;k++)rings.push({x:b.x,y:b.y,r:6,life:1+k*.25,sp:14+k*5,c:'255,230,170',w:6});
    fireballs.push({x:b.x,y:b.y,r:20,max:Math.max(W,H)*.55,life:1,atom:true,cx:b.x,cy:b.y});
    flash=1;shake=38;boom(2.2,70,2.2,9);
    setTimeout(()=>boom(1.2,60,1.8,8),350);
    navigator.vibrate&&navigator.vibrate([200,60,300]);
  }
}

/* ---------- input ---------- */
function tap(e){
  if(document.getElementById('intro'))return;
  const t=e.touches?e.touches[0]:e,x=t.clientX,y=t.clientY;
  if(!ground()){launch(x);return}
  if(selected==='lari100')startLari(x,y,100);
  else if(selected==='lari1000')startLari(x,y,1000);
  else startBomb(selected,x,y);
}
cv.addEventListener('touchstart',e=>{e.preventDefault();tap(e)},{passive:false});
cv.addEventListener('mousedown',tap);

/* ---------- loop ---------- */
function drawBomb(b){
  const r=b.r;
  // rope fuse (sutli = rope)
  const fl=b.kind==='sutli'?46:b.kind==='atom'?60:34;
  const burnt=Math.min(1,b.t/b.fuse);
  const len=fl*(1-burnt);
  ctx.strokeStyle=b.kind==='sutli'?'#c9a46a':'#d7c7a0';ctx.lineWidth=b.kind==='sutli'?3:2.5;
  ctx.beginPath();ctx.moveTo(b.x,b.y-r);
  const tipX=b.x+Math.sin(len*.15)*10+len*.2,tipY=b.y-r-len;
  ctx.bezierCurveTo(b.x+10,b.y-r-len*.3,b.x-8,b.y-r-len*.7,tipX,tipY);ctx.stroke();
  // body
  const g=ctx.createRadialGradient(b.x-r*.3,b.y-r*.3,r*.1,b.x,b.y,r);
  g.addColorStop(0,'#ffffff55');g.addColorStop(.25,b.col);g.addColorStop(1,'#000');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.283);ctx.fill();
  ctx.strokeStyle=b.band;ctx.lineWidth=b.kind==='atom'?5:3;
  ctx.beginPath();ctx.ellipse(b.x,b.y,r,r*.35,0,0,6.283);ctx.stroke();
  if(b.kind==='atom'){ctx.fillStyle='#ffd000';ctx.font='bold '+(r*.8)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('☢',b.x,b.y-r*.05)}
  // spark at fuse tip
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(tipX,tipY,3+Math.random()*3,0,6.283);ctx.fill();
  sparks.push({x:tipX,y:tipY,vx:(Math.random()-.5)*3,vy:-Math.random()*3,life:.7,decay:.08,h:35+Math.random()*15,s:100,size:1.6,g:.1});
  ctx.globalCompositeOperation='source-over';
}

function frame(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(shake>.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}else shake=0;

  const g=ground();
  modeEl.innerHTML=g?'<b>GROUND</b> · pick a cracker, tap to light':'<b>SKY</b> · tap to launch a shell';
  bar.style.display=g?'flex':'none';
  skyHint.style.display=g?'none':'block';

  ctx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy*=.985;
    sparks.push({x:r.x,y:r.y,vx:(Math.random()-.5)*.5,vy:Math.random()*.8,life:.6,decay:.05,h:35,s:100,size:1.4,g:0});
    if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y,r.hue);rockets.splice(i,1)}
  }
  for(let i=laris.length-1;i>=0;i--){
    const L=laris[i],prev=Math.floor(L.t/L.dur*L.count);
    L.t++;
    const now=Math.min(L.count,Math.floor(L.t/L.dur*L.count));
    for(let k=prev;k<now;k++){const p=L.pts[k];if(p)pop(p.x,p.y,L.big?Math.random()<.3:Math.random()<.2)}
    // burning head glow
    const hp=L.pts[Math.min(now,L.count-1)];
    ctx.fillStyle='rgba(255,200,90,.9)';ctx.beginPath();ctx.arc(hp.x,hp.y,5+Math.random()*3,0,6.283);ctx.fill();
    if(L.t>=L.dur){
      const lp=L.pts[L.count-1];pop(lp.x,lp.y,true);boom(.8,300,.5);
      laris.splice(i,1);
    }
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.life<=0){sparks.splice(i,1);continue}
    ctx.fillStyle=`hsla(${p.h},${p.s}%,${55+p.life*25}%,${p.life})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life+.4,0,6.283);ctx.fill();
  }
  for(let i=fireballs.length-1;i>=0;i--){
    const f=fireballs[i];f.r+=(f.max-f.r)*(f.atom?.045:.12);f.life-=f.atom?.011:.045;
    if(f.life<=0){fireballs.splice(i,1);continue}
    const a=Math.max(0,f.life);
    if(f.atom){f.y-=1.2; // rising mushroom
      if(Math.random()<.8)smoke.push({x:f.cx+(Math.random()-.5)*f.r*.35,y:f.cy-(f.cy-f.y)*Math.random(),r:f.r*.25,life:1});
      const rg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      rg.addColorStop(0,`rgba(255,255,230,${a})`);rg.addColorStop(.3,`rgba(255,200,60,${a*.9})`);
      rg.addColorStop(.7,`rgba(255,80,10,${a*.6})`);rg.addColorStop(1,'rgba(120,20,0,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
      // stem
      const sg=ctx.createLinearGradient(0,f.cy,0,f.y);
      sg.addColorStop(0,`rgba(255,120,20,${a*.7})`);sg.addColorStop(1,`rgba(255,200,80,${a*.3})`);
      ctx.fillStyle=sg;ctx.fillRect(f.cx-f.r*.13,f.y,f.r*.26,f.cy-f.y);
    }else{
      const rg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      rg.addColorStop(0,`rgba(255,240,180,${a})`);rg.addColorStop(.5,`rgba(255,140,30,${a*.7})`);rg.addColorStop(1,'rgba(150,30,0,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
    }
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.r+=r.sp;r.life-=.04;
    if(r.life<=0){rings.splice(i,1);continue}
    ctx.strokeStyle=`rgba(${r.c},${Math.min(1,r.life)*.7})`;ctx.lineWidth=r.w||3;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  for(let i=smoke.length-1;i>=0;i--){
    const s=smoke[i];s.life-=.012;s.y-=.6;s.r+=.6;
    if(s.life<=0){smoke.splice(i,1);continue}
    ctx.fillStyle=`rgba(40,35,40,${s.life*.18})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
  }
  // lari strings (unburnt part)
  for(const L of laris){
    const now=Math.floor(L.t/L.dur*L.count);
    ctx.strokeStyle='#c8321f';ctx.lineWidth=L.big?2:2.5;
    ctx.beginPath();ctx.moveTo(L.pts[Math.min(now,L.count-1)].x,L.pts[Math.min(now,L.count-1)].y);
    for(let k=now;k<L.count;k+=L.big?4:1)ctx.lineTo(L.pts[k].x,L.pts[k].y);
    ctx.stroke();
    ctx.fillStyle='#e8c23a';
    for(let k=now;k<L.count;k+=L.big?10:4){ctx.beginPath();ctx.arc(L.pts[k].x,L.pts[k].y,L.big?2.2:3,0,6.283);ctx.fill()}
  }
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];b.t++;drawBomb(b);
    if(b.t>=b.fuse){explode(b);bombs.splice(i,1)}
  }
  if(flash>0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle=`rgba(255,225,175,${Math.min(1,flash)})`;ctx.fillRect(-50,-50,W+100,H+100);
    flash*=.88;if(flash<.01)flash=0;
  }
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
document.getElementById('start').addEventListener('click',async()=>{
  initAudio();
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')
      await DeviceOrientationEvent.requestPermission();
  }catch(e){}
  addEventListener('deviceorientation',e=>{if(e.beta!=null){hasOri=true;tilt=e.beta}});
  try{
    cam.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){}
  document.getElementById('intro').remove();
  frame();
  setTimeout(()=>launch(W/2),400);
});
