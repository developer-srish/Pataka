<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Diwali crackers through your phone camera. Tilt up for sky shots, tilt down for Lari, Lakshmi, Sutli and Atom bombs.">
<title>Phataka</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:#0d0a16;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
  video,canvas{position:fixed;inset:0;width:100%;height:100%}
  video{object-fit:cover;background:linear-gradient(#0d0a16,#2a1236 70%,#4a1d2e)}
  #intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
    background:radial-gradient(circle at 50% 30%,#3b1550,#0d0a16 70%)}
  #intro small{letter-spacing:.35em;text-transform:uppercase;color:#ffb347;font-size:12px}
  #intro h1{font-size:clamp(48px,15vw,96px);font-weight:800;background:linear-gradient(90deg,#ffb347,#ff5e62,#ffd86b);-webkit-background-clip:text;background-clip:text;color:transparent}
  #intro p{max-width:310px;color:#d8c9e6;line-height:1.5}
  #start{margin-top:10px;padding:16px 56px;border:0;border-radius:999px;font-size:18px;font-weight:700;color:#2a0f00;
    background:linear-gradient(90deg,#ffd86b,#ff9a3c);box-shadow:0 0 30px #ff9a3c88;cursor:pointer}
  #mode{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:5;text-align:center;font-size:13px;pointer-events:none;text-shadow:0 1px 4px #000}
  #mode span{display:inline-block;padding:7px 16px;border-radius:999px;background:#000a;border:1px solid #ffffff33}
  #mode b{color:#ffd86b}
  .bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:none;gap:8px;justify-content:center;padding:0 8px}
  .bar button{flex:1;max-width:84px;padding:10px 2px;border-radius:14px;border:1.5px solid #ffffff44;background:#000b;color:#fff;font-size:11px;font-weight:700;line-height:1.25;cursor:pointer}
  .bar button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
  .bar button.on{border-color:#ffd86b;background:#ff9a3c33;box-shadow:0 0 14px #ffb34788}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="mode"><span></span></div>
<div id="skybar" class="bar"></div>
<div id="bar" class="bar"></div>
<div id="intro">
  <small>Happy Diwali</small>
  <h1>Phataka</h1>
  <p>Allow camera. Tilt up for sky shots (single, 12, 25, 50 shots, finale). Tilt down for Lari, Lakshmi, Sutli and Atom bombs.</p>
  <button id="start">Start</button>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const cam=document.getElementById('cam'),modeEl=document.querySelector('#mode span'),
      bar=document.getElementById('bar'),skyBar=document.getElementById('skybar');
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- audio ---------- */
let ac,noiseBuf,lastCrackle=0;
function initAudio(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function noise(type,freq,vol,dur,delay=0,q=0.7){
  if(!ac)return;
  const t=ac.currentTime+delay,s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random()*1.5,dur+.02);
}
function sweepNoise(vol,low,dur,hi=4,delay=0){
  if(!ac)return;
  const t=ac.currentTime+delay,s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(low*hi,t);f.frequency.exponentialRampToValueAtTime(Math.max(low,30),t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t,Math.random()*.5,dur+.02);
}
function thump(vol,f0,dur,delay=0){
  if(!ac)return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(22,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
// big explosion: crack + sweep + sub thump + rumble tail + echo
function bigBoom(power){ // 1 = sky shell, 2 = sutli/lakshmi, 3 = atom
  sweepNoise(Math.min(2.5,.7*power),Math.max(60,260/power),.8+power*.6,6);
  noise('highpass',2200,.5*power,.12);
  thump(Math.min(2.5,.7*power),110,.7+power*.5);
  if(power>=2){
    sweepNoise(Math.min(2.5,.6*power),70,1.8+power*.4,8,.18);
    noise('lowpass',160,.5*power,2+power*.5,.25);
    thump(1.6,70,1.8,.2);
    sweepNoise(.9,90,1.5,5,.55+power*.1); // echo off buildings
  }
  if(power>=3){thump(2.4,60,2.6,.05);sweepNoise(2,50,3,9,.5)}
}
// realistic lari snap: sharp crack + paper-body thud, irregular
function crack(vol=.3,big=false){
  if(!ac)return;
  const now=ac.currentTime;if(now-lastCrackle<.004)return;lastCrackle=now;
  const d=Math.random()*.014;
  noise('highpass',rnd(1500,4800),vol*rnd(.7,1.1),.045,d,1.2);
  noise('bandpass',rnd(900,2200),vol*.9,big?.12:.07,d,.9);
  noise('lowpass',big?500:900,vol*(big?1.3:.8),big?.2:.1,d);
  if(big)thump(vol*.7,rnd(160,230),.12,d);
}
function whistle(){
  if(!ac)return;
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(rnd(450,600),t);o.frequency.exponentialRampToValueAtTime(rnd(1500,2000),t+.7);
  g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.7);
}
function hiss(dur){noise('bandpass',5000,.05,Math.min(dur,2.5))}

/* ---------- state ---------- */
const rockets=[],sparks=[],bombs=[],laris=[],rings=[],fireballs=[],smoke=[];
let flash=0,shake=0,tilt=90,hasOri=false,selected='lari100',selSky='single',lastSkyBoom=0;
const palettes=[[45,100],[0,100],[330,95],[190,100],[120,90],[280,95],[20,100],[210,100]];
const DESIGNS=['peony','chrysanthemum','willow','ring','heart','star','spiral','crossette','glitter','double'];

const GROUND={
  lari100:{label:'Lari<br>100',icon:'🧨'},
  lari1000:{label:'Lari<br>1000',icon:'🎇'},
  lashi:{label:'Lakshmi<br>Bomb',icon:'🪔'},
  sutli:{label:'Sutli<br>Bomb',icon:'💣'},
  atom:{label:'Atom<br>Bomb',icon:'☢️'}
};
const SKY={
  single:{label:'Single<br>Shell',icon:'🎆'},
  s12:{label:'12<br>Shot',icon:'✨'},
  s25:{label:'25<br>Shot',icon:'🎇'},
  s50:{label:'50<br>Shot',icon:'💥'},
  s100:{label:'Grand<br>Finale',icon:'🌟'}
};
function buildBar(el,list,get,set){
  Object.keys(list).forEach(k=>{
    const b=document.createElement('button');
    b.innerHTML='<i>'+list[k].icon+'</i>'+list[k].label;
    if(k===get())b.className='on';
    b.addEventListener('click',e=>{e.stopPropagation();set(k);[...el.children].forEach(c=>c.classList.toggle('on',c===b))});
    b.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
    el.appendChild(b);
  });
}
buildBar(bar,GROUND,()=>selected,k=>selected=k);
buildBar(skyBar,SKY,()=>selSky,k=>selSky=k);
function ground(){return hasOri&&tilt<50}

/* ---------- sky ---------- */
function launch(x,design,hue,delayTy){
  rockets.push({x,y:H,vx:rnd(-.6,.6),vy:-rnd(9,12.5),ty:H*(delayTy||rnd(.1,.45)),
    hue:hue||palettes[Math.random()*palettes.length|0],
    design:design||DESIGNS[Math.random()*DESIGNS.length|0]});
  whistle();
}
function burst(x,y,hue,design){
  let [h,s]=hue;
  const add=(a,sp,o)=>sparks.push(Object.assign({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.011,h,s,size:2,g:.04},o||{}));
  const TAU=6.2832;
  switch(design){
    case'peony':{const n=130;for(let i=0;i<n;i++)add(TAU*i/n,rnd(3.8,4.4));break}
    case'chrysanthemum':{const n=110;for(let i=0;i<n;i++)add(TAU*i/n,rnd(2,5),{decay:.006,g:.03,size:2.4});break}
    case'willow':{const n=100;h=38;s=85;for(let i=0;i<n;i++)add(Math.random()*TAU,rnd(1.5,4.5),{decay:.0042,g:.032,size:1.5,h:rnd(32,46)});break}
    case'ring':{const n=70;for(let i=0;i<n;i++)add(TAU*i/n,5.2,{g:.02,decay:.012});break}
    case'double':{const n=70;for(let i=0;i<n;i++){add(TAU*i/n,5.4,{g:.02});add(TAU*i/n,2.7,{h:(h+160)%360,g:.02})}break}
    case'heart':{const n=90;for(let i=0;i<n;i++){const t=TAU*i/n,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      sparks.push({x,y,vx:hx*.27,vy:hy*.27,life:1,decay:.011,h:rnd(340,360),s:95,size:2.2,g:.02})}break}
    case'star':{const n=120;for(let i=0;i<n;i++){const a=TAU*i/n,m=Math.pow(Math.abs(Math.cos(2.5*a)),1.5);add(a,2+4.2*m,{g:.02,decay:.012})}break}
    case'spiral':{const n=120;for(let i=0;i<n;i++)add(i*.33,.8+i*.045,{g:.02,decay:.012});break}
    case'crossette':{for(let i=0;i<10;i++)add(TAU*i/10,rnd(4.2,4.8),{decay:.016,split:true,size:2.6});break}
    case'glitter':{const n=120;for(let i=0;i<n;i++)add(Math.random()*TAU,rnd(.5,5.5),{decay:.0075,tw:true,h:rnd(40,55),s:70,size:1.8});break}
  }
  flash=Math.min(flash+.22,.45);
  const now=performance.now();
  if(now-lastSkyBoom>90){lastSkyBoom=now;bigBoom(1)}
  setTimeout(()=>crack(.3),rnd(150,300));setTimeout(()=>crack(.25),rnd(300,500));
}
function sequence(count,gap,fan){
  const designs=DESIGNS.slice().sort(()=>Math.random()-.5);
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const u=count>1?i/(count-1):.5;
      let x=fan?W*(.08+.84*(i%2?1-u:u)):rnd(W*.08,W*.92);
      if(count<=12)x=W*(.1+.8*u);
      const hue=palettes[(i+(Math.random()*3|0))%palettes.length];
      const design=count>=50?DESIGNS[Math.random()*DESIGNS.length|0]:designs[i%designs.length];
      launch(x,design,hue,rnd(.1,.45));
    },i*gap);
  }
}
function skyShot(x){
  if(selSky==='single')launch(x);
  else if(selSky==='s12')sequence(12,260,false);
  else if(selSky==='s25')sequence(25,190,true);
  else if(selSky==='s50')sequence(50,130,false);
  else sequence(100,85,false);
}

/* ---------- ground crackers ---------- */
function paper(x,y,n,pow,h=355){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=Math.random()*pow;
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-pow*.3,life:1,decay:.014+Math.random()*.02,h:h+Math.random()*12,s:92,size:2+Math.random()*2.2,g:.15});
  }
}
function pop(x,y,big){
  const n=big?9:5;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=1+Math.random()*(big?5:3);
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,decay:.07+Math.random()*.05,h:rnd(15,40),s:100,size:1.6+Math.random()*1.5,g:.12});
  }
  paper(x,y,big?5:3,big?3.5:2.2);
  if(Math.random()<.25)smoke.push({x,y,r:6,life:.6});
  flash=Math.min(flash+(big?.05:.025),.22);
  if(big)shake=Math.max(shake,1.8);
  crack(big?.42:.26,big);
}
function startLari(x,y,count){
  const big=count>100;
  const span=W*(big?.94:.62);
  const x0=Math.max(W*.03,Math.min(x-span/2,W-span-W*.03));
  const pts=[];
  for(let i=0;i<count;i++){
    const u=i/(count-1);
    pts.push({x:x0+span*u,y:y+Math.sin(u*(big?18:7))*(big?14:10)});
  }
  laris.push({pts,count,t:0,dur:big?780:380,big});
  hiss(1.5);
}
function startBomb(kind,x,y){
  const cfg={
    sutli:{fuse:110,r:11,col:'#6b4a2b',band:'#d7b98e'},
    lashi:{fuse:150,r:17,col:'#b3261e',band:'#ffd86b'},
    atom:{fuse:260,r:30,col:'#1d1d22',band:'#ffd000'}
  }[kind];
  bombs.push(Object.assign({x,y,kind,t:0},cfg));
  hiss(cfg.fuse/60);
}
function explode(b){
  const vib=p=>navigator.vibrate&&navigator.vibrate(p);
  if(b.kind==='sutli'){
    for(let i=0;i<120;i++){const a=Math.random()*6.283,sp=Math.random()*11;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,decay:.025+Math.random()*.03,h:rnd(20,45),s:100,size:2+Math.random()*3,g:.12})}
    paper(b.x,b.y,70,10,30);
    for(let k=0;k<2;k++)rings.push({x:b.x,y:b.y,r:5,life:1+k*.2,sp:12+k*5,c:'255,220,150',w:5});
    fireballs.push({x:b.x,y:b.y,r:10,max:110,life:1});
    flash=.9;shake=Math.max(shake,26);bigBoom(2);vib([120,40,160]);
  }else if(b.kind==='lashi'){
    for(let i=0;i<160;i++){const a=Math.random()*6.283,sp=Math.random()*12;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:.02+Math.random()*.03,h:rnd(15,40),s:100,size:2+Math.random()*3,g:.12})}
    paper(b.x,b.y,110,12,0);
    for(let k=0;k<3;k++)rings.push({x:b.x,y:b.y,r:6,life:1+k*.2,sp:12+k*5,c:'255,190,110',w:5});
    fireballs.push({x:b.x,y:b.y,r:10,max:150,life:1});
    flash=1;shake=Math.max(shake,32);bigBoom(2.3);vib([150,50,220]);
  }else{
    for(let i=0;i<340;i++){const a=Math.random()*6.283,sp=Math.random()*16;
      sparks.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:.01+Math.random()*.02,h:rnd(15,55),s:100,size:2.5+Math.random()*3.5,g:.06})}
    paper(b.x,b.y,130,15,20);
    for(let k=0;k<4;k++)rings.push({x:b.x,y:b.y,r:6,life:1+k*.25,sp:14+k*5,c:'255,230,170',w:6});
    fireballs.push({x:b.x,y:b.y,r:20,max:Math.max(W,H)*.55,life:1,atom:true,cx:b.x,cy:b.y});
    flash=1;shake=40;bigBoom(3);vib([200,60,300]);
  }
}

/* ---------- input ---------- */
function tap(e){
  if(document.getElementById('intro'))return;
  const t=e.touches?e.touches[0]:e,x=t.clientX,y=t.clientY;
  if(!ground()){skyShot(x);return}
  if(selected==='lari100')startLari(x,y,100);
  else if(selected==='lari1000')startLari(x,y,1000);
  else startBomb(selected,x,y);
}
cv.addEventListener('touchstart',e=>{e.preventDefault();tap(e)},{passive:false});
cv.addEventListener('mousedown',tap);

/* ---------- drawing ---------- */
function drawBomb(b){
  const r=b.r;
  const fl=b.kind==='sutli'?46:b.kind==='atom'?60:34;
  const len=fl*(1-Math.min(1,b.t/b.fuse));
  ctx.strokeStyle=b.kind==='sutli'?'#c9a46a':'#d7c7a0';ctx.lineWidth=b.kind==='sutli'?3:2.5;
  ctx.beginPath();ctx.moveTo(b.x,b.y-r);
  const tipX=b.x+Math.sin(len*.15)*10+len*.2,tipY=b.y-r-len;
  ctx.bezierCurveTo(b.x+10,b.y-r-len*.3,b.x-8,b.y-r-len*.7,tipX,tipY);ctx.stroke();
  const g=ctx.createRadialGradient(b.x-r*.3,b.y-r*.3,r*.1,b.x,b.y,r);
  g.addColorStop(0,'#ffffff55');g.addColorStop(.25,b.col);g.addColorStop(1,'#000');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,6.283);ctx.fill();
  ctx.strokeStyle=b.band;ctx.lineWidth=b.kind==='atom'?5:3;
  ctx.beginPath();ctx.ellipse(b.x,b.y,r,r*.35,0,0,6.283);ctx.stroke();
  if(b.kind==='atom'){ctx.fillStyle='#ffd000';ctx.font='bold '+(r*.8)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('☢',b.x,b.y-r*.05)}
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.arc(tipX,tipY,3+Math.random()*3,0,6.283);ctx.fill();
  sparks.push({x:tipX,y:tipY,vx:rnd(-1.5,1.5),vy:-Math.random()*3,life:.7,decay:.08,h:rnd(35,50),s:100,size:1.6,g:.1});
  ctx.globalCompositeOperation='source-over';
}

function frame(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(shake>.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}else shake=0;

  const g=ground();
  modeEl.innerHTML=g?'<b>GROUND</b> · pick a cracker, tap to light':'<b>SKY</b> · pick a shot type, tap to fire';
  bar.style.display=g?'flex':'none';
  skyBar.style.display=g?'none':'flex';

  ctx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.x+=r.vx;r.y+=r.vy;r.vy*=.985;
    sparks.push({x:r.x,y:r.y,vx:rnd(-.25,.25),vy:Math.random()*.8,life:.6,decay:.05,h:35,s:100,size:1.4,g:0});
    if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y,r.hue,r.design);rockets.splice(i,1)}
  }
  for(let i=laris.length-1;i>=0;i--){
    const L=laris[i],prev=Math.floor(L.t/L.dur*L.count);
    L.t++;
    const now=Math.min(L.count,Math.floor(L.t/L.dur*L.count));
    for(let k=prev;k<now;k++){const p=L.pts[k];if(p)pop(p.x,p.y,Math.random()<(L.big?.3:.2))}
    const hp=L.pts[Math.min(now,L.count-1)];
    ctx.fillStyle='rgba(255,180,70,.95)';ctx.beginPath();ctx.arc(hp.x,hp.y,5+Math.random()*3,0,6.283);ctx.fill();
    if(L.t>=L.dur){const lp=L.pts[L.count-1];pop(lp.x,lp.y,true);bigBoom(1.3);laris.splice(i,1)}
  }
  for(let i=sparks.length-1;i>=0;i--){
    const p=sparks[i];p.vx*=.985;p.vy=p.vy*.985+p.g;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.split&&p.life<.7){p.split=false;
      for(let k=0;k<5;k++){const a=Math.random()*6.283,sp=rnd(1.5,3);
        sparks.push({x:p.x,y:p.y,vx:p.vx*.3+Math.cos(a)*sp,vy:p.vy*.3+Math.sin(a)*sp,life:.85,decay:.016,h:p.h,s:p.s,size:2,g:.04})}
      sparks.splice(i,1);continue}
    if(p.life<=0){sparks.splice(i,1);continue}
    if(p.tw&&Math.random()<.45)continue;
    ctx.fillStyle=`hsla(${p.h},${p.s}%,${55+p.life*25}%,${p.life})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life+.4,0,6.283);ctx.fill();
  }
  for(let i=fireballs.length-1;i>=0;i--){
    const f=fireballs[i];f.r+=(f.max-f.r)*(f.atom?.045:.12);f.life-=f.atom?.011:.04;
    if(f.life<=0){fireballs.splice(i,1);continue}
    const a=Math.max(0,f.life);
    if(f.atom){f.y-=1.2;
      if(Math.random()<.8)smoke.push({x:f.cx+(Math.random()-.5)*f.r*.35,y:f.cy-(f.cy-f.y)*Math.random(),r:f.r*.25,life:1});
      const rg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      rg.addColorStop(0,`rgba(255,255,230,${a})`);rg.addColorStop(.3,`rgba(255,200,60,${a*.9})`);
      rg.addColorStop(.7,`rgba(255,80,10,${a*.6})`);rg.addColorStop(1,'rgba(120,20,0,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
      const sg=ctx.createLinearGradient(0,f.cy,0,f.y);
      sg.addColorStop(0,`rgba(255,120,20,${a*.7})`);sg.addColorStop(1,`rgba(255,200,80,${a*.3})`);
      ctx.fillStyle=sg;ctx.fillRect(f.cx-f.r*.13,f.y,f.r*.26,f.cy-f.y);
    }else{
      const rg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      rg.addColorStop(0,`rgba(255,240,180,${a})`);rg.addColorStop(.5,`rgba(255,140,30,${a*.7})`);rg.addColorStop(1,'rgba(150,30,0,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();
    }
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.r+=r.sp;r.life-=.04;
    if(r.life<=0){rings.splice(i,1);continue}
    ctx.strokeStyle=`rgba(${r.c},${Math.min(1,r.life)*.7})`;ctx.lineWidth=r.w||3;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  for(let i=smoke.length-1;i>=0;i--){
    const s=smoke[i];s.life-=.012;s.y-=.6;s.r+=.6;
    if(s.life<=0){smoke.splice(i,1);continue}
    ctx.fillStyle=`rgba(50,45,50,${s.life*.2})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
  }
  // red lari: burnt paper trail + red crackers still to go off
  for(const L of laris){
    const now=Math.min(L.count-1,Math.floor(L.t/L.dur*L.count)),step=L.big?3:1;
    ctx.strokeStyle='rgba(30,25,25,.75)';ctx.lineWidth=L.big?2:3;
    ctx.beginPath();ctx.moveTo(L.pts[0].x,L.pts[0].y);
    for(let k=0;k<=now;k+=step)ctx.lineTo(L.pts[k].x,L.pts[k].y);ctx.stroke();
    ctx.strokeStyle='#9c1a10';ctx.lineWidth=L.big?2:2.5;
    ctx.beginPath();ctx.moveTo(L.pts[now].x,L.pts[now].y);
    for(let k=now;k<L.count;k+=step)ctx.lineTo(L.pts[k].x,L.pts[k].y);ctx.stroke();
    const gap=L.big?8:3;
    for(let k=now;k<L.count;k+=gap){
      const p=L.pts[k];
      ctx.fillStyle='#e0261a';
      ctx.fillRect(p.x-(L.big?2:3),p.y-(L.big?4:6),L.big?4:6,L.big?8:12);
      ctx.fillStyle='#ffcf3a';ctx.fillRect(p.x-(L.big?2:3),p.y-(L.big?4:6),L.big?4:6,2);
    }
  }
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];b.t++;drawBomb(b);
    if(b.t>=b.fuse){explode(b);bombs.splice(i,1)}
  }
  if(flash>0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle=`rgba(255,225,175,${Math.min(1,flash)})`;ctx.fillRect(0,0,W,H);
    flash*=.88;if(flash<.01)flash=0;
  }
  requestAnimationFrame(frame);
}

/* ---------- start ---------- */
document.getElementById('start').addEventListener('click',async()=>{
  initAudio();
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')
      await DeviceOrientationEvent.requestPermission();
  }catch(e){}
  addEventListener('deviceorientation',e=>{if(e.beta!=null){hasOri=true;tilt=e.beta}});
  try{
    cam.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){}
  document.getElementById('intro').remove();
  frame();
  setTimeout(()=>launch(W/2,'peony'),400);
});

// Desktop testing: press G to toggle ground mode when no motion sensor exists
addEventListener('keydown',e=>{
  if(e.key==='g'||e.key==='G'){hasOri=true;tilt=tilt<50?90:20}
});
})();
